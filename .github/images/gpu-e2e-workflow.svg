<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 880" width="1300" height="880">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1300" height="880" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1f2328">

    <!-- title -->
    <text x="20" y="46" font-size="28" font-weight="bold">Kepler GPU e2e workflow</text>
    <text x="20" y="80" font-size="18" fill="#57606a">Manual runs for PRs that touch GPU code, plus a weekly run on main, on the CNCF A10 runner</text>

    <!-- column 1: triggers -->
    <rect x="20" y="115" width="240" height="215" rx="10" fill="#eaf2fb" stroke="#4a78b5" stroke-width="2"/>
    <text x="140" y="153" font-size="22" font-weight="bold" text-anchor="middle">Manual run</text>
    <text x="140" y="183" font-size="17" text-anchor="middle">Actions &gt; Run workflow</text>
    <text x="140" y="222" font-size="17" fill="#57606a" text-anchor="middle">inputs</text>
    <text x="140" y="250" font-size="18" text-anchor="middle">PR number</text>
    <text x="140" y="276" font-size="18" text-anchor="middle">reviewed commit</text>
    <text x="140" y="302" font-size="16" fill="#57606a" text-anchor="middle">(both optional)</text>

    <rect x="20" y="440" width="240" height="160" rx="10" fill="#eaf2fb" stroke="#4a78b5" stroke-width="2"/>
    <text x="140" y="478" font-size="22" font-weight="bold" text-anchor="middle">Weekly run</text>
    <text x="140" y="510" font-size="18" text-anchor="middle">every Monday</text>
    <text x="140" y="536" font-size="18" text-anchor="middle">tests main</text>
    <text x="140" y="562" font-size="16" fill="#57606a" text-anchor="middle">no inputs, no PR</text>

    <!-- column 2: quick check -->
    <rect x="340" y="115" width="290" height="265" rx="10" fill="#eef7ee" stroke="#3f8f4a" stroke-width="2"/>
    <text x="485" y="153" font-size="22" font-weight="bold" text-anchor="middle">Quick check</text>
    <text x="485" y="181" font-size="17" fill="#57606a" text-anchor="middle">ubuntu-latest, no GPU, seconds</text>
    <text x="360" y="222" font-size="18">&#8226; PR exists and is open</text>
    <text x="360" y="256" font-size="18">&#8226; PR head is still the</text>
    <text x="378" y="280" font-size="18">reviewed commit</text>
    <text x="360" y="314" font-size="18">&#8226; mark the PR:</text>
    <circle cx="387" cy="335" r="7" fill="#d4a72c"/>
    <text x="400" y="341" font-size="18">GPU e2e: running</text>

    <rect x="340" y="430" width="290" height="110" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
    <text x="485" y="468" font-size="20" font-weight="bold" text-anchor="middle">Check fails</text>
    <text x="485" y="497" font-size="17" text-anchor="middle">stop here, no GPU used</text>
    <text x="485" y="523" font-size="15" fill="#57606a" text-anchor="middle">(typo, closed PR, new commit)</text>

    <!-- column 3: GPU job -->
    <rect x="710" y="115" width="570" height="495" rx="10" fill="#fff5e8" stroke="#d9822b" stroke-width="2"/>
    <text x="995" y="153" font-size="24" font-weight="bold" text-anchor="middle">GPU job</text>
    <text x="995" y="182" font-size="17" fill="#57606a" text-anchor="middle">oracle-vm-gpu-a10-1 (runner group GPUs), read-only token</text>
    <text x="995" y="207" font-size="17" fill="#57606a" text-anchor="middle">one run at a time, 30 minute limit</text>

    <circle cx="752" cy="246" r="13" fill="#d9822b"/>
    <text x="752" y="252" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="776" y="252" font-size="20">check out the exact commit</text>

    <circle cx="752" cy="294" r="13" fill="#d9822b"/>
    <text x="752" y="300" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="776" y="300" font-size="20">print GPU model, driver, CUDA (fail fast)</text>

    <circle cx="752" cy="342" r="13" fill="#d9822b"/>
    <text x="752" y="348" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="776" y="348" font-size="20">build kepler and the e2e test binary</text>

    <circle cx="752" cy="390" r="13" fill="#d9822b"/>
    <text x="752" y="396" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="776" y="396" font-size="20">sample nvidia-smi power once a second</text>

    <circle cx="752" cy="438" r="13" fill="#d9822b"/>
    <text x="752" y="444" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="776" y="444" font-size="20">run the GPU e2e tests on the real A10</text>
    <text x="776" y="467" font-size="15" fill="#57606a">real NVML, fake CPU meter (the VM has no RAPL)</text>

    <circle cx="752" cy="498" r="13" fill="#d9822b"/>
    <text x="752" y="504" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    <text x="776" y="504" font-size="20">check Kepler watts match nvidia-smi</text>

    <rect x="728" y="528" width="534" height="46" rx="8" fill="none" stroke="#d9822b" stroke-width="1.5" stroke-dasharray="6,5"/>
    <circle cx="752" cy="551" r="13" fill="#ffffff" stroke="#d9822b" stroke-width="2"/>
    <text x="752" y="557" font-size="16" font-weight="bold" fill="#d9822b" text-anchor="middle">7</text>
    <text x="776" y="557" font-size="20">GPU load test, check PID attribution</text>
    <text x="1250" y="557" font-size="15" fill="#57606a" font-style="italic" text-anchor="end">follow-up PR</text>

    <!-- arrows between columns -->
    <line x1="260" y1="225" x2="338" y2="225" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="300" y="195" font-size="15" fill="#57606a" text-anchor="middle">PR #</text>
    <text x="300" y="213" font-size="15" fill="#57606a" text-anchor="middle">+ commit</text>

    <line x1="630" y1="225" x2="708" y2="225" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="670" y="195" font-size="15" fill="#57606a" text-anchor="middle">verified</text>
    <text x="670" y="213" font-size="15" fill="#57606a" text-anchor="middle">commit</text>

    <line x1="485" y1="380" x2="485" y2="428" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="497" y="410" font-size="15" fill="#c0392b">fails</text>

    <line x1="260" y1="575" x2="708" y2="575" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="485" y="598" font-size="15" fill="#57606a" text-anchor="middle">main, skips the quick check</text>

    <!-- results bus -->
    <line x1="995" y1="610" x2="995" y2="680" stroke="#57606a" stroke-width="2.5"/>
    <text x="983" y="652" font-size="15" fill="#57606a" text-anchor="end">results, written by a small ubuntu-latest job</text>
    <line x1="170" y1="680" x2="1130" y2="680" stroke="#57606a" stroke-width="2.5"/>
    <line x1="170" y1="680" x2="170" y2="710" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="490" y1="680" x2="490" y2="710" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="810" y1="680" x2="810" y2="710" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="1130" y1="680" x2="1130" y2="710" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- outputs row -->
    <rect x="20" y="712" width="300" height="150" rx="10" fill="#f4effc" stroke="#7a5cc7" stroke-width="2"/>
    <text x="170" y="748" font-size="21" font-weight="bold" text-anchor="middle">PR check</text>
    <circle cx="68" cy="775" r="7" fill="#2da44e"/>
    <text x="82" y="781" font-size="18">GPU e2e: passed</text>
    <circle cx="68" cy="803" r="7" fill="#cf222e"/>
    <text x="82" y="809" font-size="18">GPU e2e: failed</text>
    <text x="170" y="842" font-size="15" fill="#57606a" text-anchor="middle">manual runs, links to the run</text>

    <rect x="340" y="712" width="300" height="150" rx="10" fill="#f4effc" stroke="#7a5cc7" stroke-width="2"/>
    <text x="490" y="748" font-size="21" font-weight="bold" text-anchor="middle">Run summary</text>
    <text x="490" y="779" font-size="17" text-anchor="middle">GPU, driver, CUDA</text>
    <text x="490" y="805" font-size="17" text-anchor="middle">Kepler vs nvidia-smi watts</text>
    <text x="490" y="831" font-size="17" text-anchor="middle">power over time chart</text>

    <rect x="660" y="712" width="300" height="150" rx="10" fill="#f4effc" stroke="#7a5cc7" stroke-width="2"/>
    <text x="810" y="748" font-size="21" font-weight="bold" text-anchor="middle">Logs</text>
    <text x="810" y="779" font-size="17" text-anchor="middle">Kepler log</text>
    <text x="810" y="805" font-size="17" text-anchor="middle">nvidia-smi power samples</text>
    <text x="810" y="831" font-size="17" text-anchor="middle">kept for 1 day</text>

    <rect x="980" y="712" width="300" height="150" rx="10" fill="#f4effc" stroke="#7a5cc7" stroke-width="2"/>
    <text x="1130" y="748" font-size="21" font-weight="bold" text-anchor="middle">Weekly failure</text>
    <text x="1130" y="779" font-size="17" text-anchor="middle">opens an issue, or comments</text>
    <text x="1130" y="805" font-size="17" text-anchor="middle">on the one already open</text>
    <text x="1130" y="842" font-size="15" fill="#57606a" text-anchor="middle">weekly runs only</text>
  </g>
</svg>
