<text x="304.0" y="173" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">18 h</text>
<rect x="340" y="366" width="36" height="4" rx="3" fill="#dc2626" stroke="none" stroke-width="0"/>
<text x="358.0" y="358" font-size="15" text-anchor="middle" font-weight="normal" fill="#6b7280">1m</text>
<rect x="394" y="366" width="36" height="4" rx="3" fill="#d97706" stroke="none" stroke-width="0"/>
<text x="412.0" y="358" font-size="15" text-anchor="middle" font-weight="normal" fill="#6b7280">2m</text>
<rect x="448" y="366" width="36" height="4" rx="3" fill="#dc2626" stroke="none" stroke-width="0"/>
<text x="466.0" y="358" font-size="15" text-anchor="middle" font-weight="normal" fill="#6b7280">8m</text>
<rect x="502" y="366" width="36" height="4" rx="3" fill="#dc2626" stroke="none" stroke-width="0"/>
<text x="520.0" y="358" font-size="15" text-anchor="middle" font-weight="normal" fill="#6b7280">2m</text>
<rect x="556" y="328" width="36" height="42" rx="3" fill="#dc2626" stroke="none" stroke-width="0"/>
<text x="574.0" y="320" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">4 h</text>
<rect x="610" y="366" width="36" height="4" rx="3" fill="#dc2626" stroke="none" stroke-width="0"/>
<text x="628.0" y="358" font-size="15" text-anchor="middle" font-weight="normal" fill="#6b7280">2m</text>
<rect x="664" y="180" width="36" height="190" rx="3" fill="#7c3aed" stroke="none" stroke-width="0"/>
<text x="682.0" y="172" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">18 h</text>
<rect x="718" y="366" width="36" height="4" rx="3" fill="#7c3aed" stroke="none" stroke-width="0"/>
<text x="736.0" y="358" font-size="15" text-anchor="middle" font-weight="normal" fill="#6b7280">1m</text>
<rect x="772" y="366" width="36" height="4" rx="3" fill="#d97706" stroke="none" stroke-width="0"/>
<text x="790.0" y="358" font-size="15" text-anchor="middle" font-weight="normal" fill="#6b7280">21m</text>
<text x="60" y="396" font-size="16" text-anchor="start" font-weight="normal" fill="#6b7280">Sep 2025</text>
<text x="826" y="396" font-size="16" text-anchor="end" font-weight="normal" fill="#6b7280">Oct 2026</text>
<rect x="300" y="384" width="14" height="14" rx="2" fill="#dc2626" stroke="none" stroke-width="0"/>
<text x="320" y="397" font-size="16" text-anchor="start" font-weight="normal" fill="#374151">unit tests</text>
<rect x="434" y="384" width="14" height="14" rx="2" fill="#d97706" stroke="none" stroke-width="0"/>
<text x="454" y="397" font-size="16" text-anchor="start" font-weight="normal" fill="#374151">Scorecard</text>
<rect x="559" y="384" width="14" height="14" rx="2" fill="#7c3aed" stroke="none" stroke-width="0"/>
<text x="579" y="397" font-size="16" text-anchor="start" font-weight="normal" fill="#374151">image publish</text>
<rect x="860" y="104" width="420" height="96" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
<text x="880" y="162" font-size="38" text-anchor="start" font-weight="bold" fill="#b91c1c">45 hours</text>
<text x="1068" y="146" font-size="17" text-anchor="start" font-weight="normal" fill="#374151">main showed red with</text>
<text x="1068" y="170" font-size="17" text-anchor="start" font-weight="normal" fill="#374151">nothing wrong in the code</text>
<rect x="860" y="214" width="420" height="96" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
<text x="880" y="272" font-size="38" text-anchor="start" font-weight="bold" fill="#b91c1c">18 hours</text>
<text x="1068" y="256" font-size="17" text-anchor="start" font-weight="normal" fill="#374151">longest stretch, twice</text>
<text x="1068" y="280" font-size="17" text-anchor="start" font-weight="normal" fill="#374151">(Nov 2025 and Oct 2026)</text>
<rect x="860" y="324" width="420" height="96" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
<text x="880" y="382" font-size="38" text-anchor="start" font-weight="bold" fill="#b91c1c">1 in 15</text>
<text x="1068" y="366" font-size="17" text-anchor="start" font-weight="normal" fill="#374151">pushes to main hit</text>
<text x="1068" y="390" font-size="17" text-anchor="start" font-weight="normal" fill="#374151">a failure a re-run fixed</text>
<rect x="20" y="440" width="1260" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="474" font-size="21" text-anchor="start" font-weight="bold" fill="#111827">Same failure, two outcomes</text>
<text x="40" y="532" font-size="19" text-anchor="start" font-weight="bold" fill="#111827">Today</text>
<rect x="190" y="498" width="170" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="275.0" y="531" font-size="17" text-anchor="middle" font-weight="normal" fill="#111827">job hits a blip</text>
<rect x="374" y="498" width="560" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="654.0" y="531" font-size="17" text-anchor="middle" font-weight="normal" fill="#991b1b">main red until someone notices: up to 18 hours</text>
<rect x="948" y="498" width="150" height="52" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="1023.0" y="531" font-size="17" text-anchor="middle" font-weight="normal" fill="#111827">manual re-run</text>
<rect x="1112" y="498" width="120" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="1172.0" y="531" font-size="17" text-anchor="middle" font-weight="normal" fill="#111827">green</text>
<text x="40" y="612" font-size="19" text-anchor="start" font-weight="bold" fill="#111827">With this PR</text>
<rect x="190" y="578" width="170" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="275.0" y="611" font-size="17" text-anchor="middle" font-weight="normal" fill="#111827">job hits a blip</text>
<rect x="374" y="578" width="90" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="419.0" y="611" font-size="17" text-anchor="middle" font-weight="normal" fill="#991b1b">3 min</text>
<rect x="478" y="578" width="300" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="628.0" y="611" font-size="17" text-anchor="middle" font-weight="normal" fill="#111827">failed jobs re-run on their own</text>
<rect x="792" y="578" width="120" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="852.0" y="611" font-size="17" text-anchor="middle" font-weight="normal" fill="#111827">green</text>
<text x="1062" y="612" font-size="17" text-anchor="start" font-weight="bold" fill="#6d28d9">nobody has to notice</text>
<rect x="20" y="680" width="620" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="712" font-size="19" text-anchor="start" font-weight="bold" fill="#111827">Guard rails</text>
<text x="40" y="740" font-size="17" text-anchor="start" font-weight="normal" fill="#374151">At most 2 reruns, failed jobs only. A real failure stays red.</text>
<text x="40" y="766" font-size="17" text-anchor="start" font-weight="normal" fill="#374151">Cancelled runs and runs awaiting approval are never touched.</text>
<text x="40" y="790" font-size="17" text-anchor="start" font-weight="normal" fill="#374151">Covers PRs too: outside contributors cannot click Re-run.</text>
<rect x="660" y="680" width="620" height="120" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
<text x="680" y="712" font-size="19" text-anchor="start" font-weight="bold" fill="#111827">Fits with #2661</text>
<text x="680" y="740" font-size="17" text-anchor="start" font-weight="normal" fill="#374151">#2661 cancels stale e2e, k8s-bm and profiling runs on the</text>
<text x="680" y="766" font-size="17" text-anchor="start" font-weight="normal" fill="#374151">one bare-metal runner. Those workflows are not watched here,</text>
<text x="680" y="790" font-size="17" text-anchor="start" font-weight="normal" fill="#374151">so retries never add to the queue #2661 cleared.</text>
</svg>
