<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" width="1300" height="820" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1300" height="820" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/>
<text x="30" y="52" font-size="30" text-anchor="start" font-weight="bold" fill="#111827">Main went red 14 times on code that was fine</text>
<text x="30" y="84" font-size="19" text-anchor="start" font-weight="normal" fill="#4b5563">Push runs on main, Sep 2025 to Oct 2026. Each failed, then passed when someone re-ran the same commit.</text>
